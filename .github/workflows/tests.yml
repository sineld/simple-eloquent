name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer lint
      - run: composer stan

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        dependencies: [prefer-stable]
        include:
          - php: '8.2'
            laravel: '12.*'
            dependencies: prefer-lowest
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: >
          composer require
          "illuminate/database:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"
          "illuminate/pagination:${{ matrix.laravel }}"
          --no-interaction --no-update
      - run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress
      - run: composer test
